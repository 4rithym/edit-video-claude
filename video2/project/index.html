<!doctype html>
<html lang="ms" data-resolution="portrait">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script><style>@font-face{font-family:"HF Inter";src:url("assets/fonts/InterDisplay-Bold.otf") format("opentype");font-weight:700}
@font-face{font-family:"HF Inter";src:url("assets/fonts/InterDisplay-ExtraBold.otf") format("opentype");font-weight:800}
@font-face{font-family:"HF Inter";src:url("assets/fonts/InterDisplay-Black.otf") format("opentype");font-weight:900}
:root{--navy:#12233f;--yellow:#FFD400;--red:#ff3b30;--green:#22c55e;--ink:#fff;--font:"HF Inter",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--font);color:var(--ink)}
.clip{position:absolute}
#stage{position:absolute;inset:0;transform-origin:50% 40%}
#vid{left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#shade{inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.25) 100%);pointer-events:none}
.flash{inset:0;opacity:0}
.center-top{left:0;width:1080px;display:flex;flex-direction:column;align-items:center}
/* hook */
#hook{text-align:center}
.hook-l1{font-weight:900;font-size:92px;letter-spacing:-.02em;color:#fff;-webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 10px 30px rgba(0,0,0,.6)}
.hook-l2{font-weight:900;font-size:210px;line-height:1;letter-spacing:-.04em;color:var(--red);-webkit-text-stroke:18px #fff;paint-order:stroke fill;text-shadow:0 14px 40px rgba(0,0,0,.6);margin-top:6px}
.hook-l3{margin-top:28px;font-weight:800;font-size:44px;background:var(--yellow);color:#111;padding:14px 30px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tag{display:flex;align-items:center;gap:16px;background:rgba(10,18,34,.88);border:4px solid var(--yellow);padding:16px 30px 16px 22px;border-radius:999px;font-weight:900;font-size:46px;letter-spacing:.02em}
/* stickers */
.sticker{font-weight:900;font-size:62px;padding:18px 34px;border-radius:22px;border:6px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.45);white-space:nowrap;letter-spacing:-.01em}
/* wordmark & cards */
.wm{font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.wm-z{color:#fff}.wm-u{color:var(--yellow)}
.list-h .wm{display:inline-block}
.card{background:rgba(18,35,63,.94);border-radius:36px;box-shadow:0 24px 60px rgba(0,0,0,.5);border:4px solid rgba(255,212,0,.85)}
.brand-card{padding:46px 64px;text-align:center}
.tagline{margin-top:18px;font-weight:700;font-size:44px;color:#dbe4f3}
.tagline.big{font-size:52px}
.list-card{padding:30px 38px 34px;width:700px}
.list-h{font-weight:900;font-size:40px;margin-bottom:18px;color:#fff;display:flex;align-items:center;gap:12px}
.li{display:flex;align-items:center;gap:18px;font-weight:800;font-size:46px;padding:10px 0}
.banner{display:flex;align-items:center;gap:22px;background:var(--yellow);color:var(--navy);font-weight:900;font-size:66px;line-height:1.02;padding:28px 44px;border-radius:30px;border:6px solid #fff;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.browser{width:860px;border-radius:32px;overflow:hidden;background:var(--navy);box-shadow:0 30px 80px rgba(0,0,0,.6);border:4px solid rgba(255,255,255,.9)}
.bar{display:flex;align-items:center;gap:12px;background:#e8ecf3;padding:18px 24px}
.bar i{display:block;width:22px;height:22px;border-radius:50%}
.url{margin-left:18px;flex:1;background:#fff;color:#334;border-radius:14px;font-weight:700;font-size:30px;padding:10px 22px}
.bbody{padding:50px 56px 56px;text-align:left}
.b-h{margin-top:26px;font-weight:900;font-size:72px;line-height:1.05;color:#fff}
.btn{display:inline-block;margin-top:34px;background:var(--yellow);color:#111;font-weight:900;font-size:44px;padding:22px 40px;border-radius:18px}
.cal{width:420px;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.55);text-align:center}
.cal-top{background:var(--red);color:#fff;font-weight:900;font-size:64px;padding:22px 0;letter-spacing:.04em}
.cal-num{color:var(--navy);font-weight:900;font-size:260px;line-height:1.1;letter-spacing:-.05em}
.cal-cap{margin-top:34px;text-align:center;font-weight:800;font-size:56px;line-height:1.1;background:var(--navy);padding:24px 44px;border-radius:28px;border:5px solid var(--yellow)}
.cal-cap b{color:var(--yellow);font-weight:900;font-size:70px}
.cta{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:130px;letter-spacing:-.03em;color:#fff;-webkit-text-stroke:14px var(--navy);paint-order:stroke fill;text-shadow:0 14px 40px rgba(0,0,0,.6)}
.endcard{inset:0;background:radial-gradient(circle at 50% 40%,#1d3a66 0%,#12233f 55%,#0a1528 100%);display:flex;align-items:center;justify-content:center}
.end-in{display:flex;flex-direction:column;align-items:center;text-align:center}
.pill{margin-top:46px;background:var(--yellow);color:#111;font-weight:900;font-size:42px;padding:20px 38px;border-radius:999px}
/* captions */
.capwrap{left:60px;width:960px;top:1290px;display:flex;justify-content:center}
.cap{text-align:center;font-weight:900;font-size:84px;line-height:1.08;letter-spacing:-.02em;text-transform:uppercase}
.cap .w{display:inline-block;margin:0 14px;color:#fff;-webkit-text-stroke:13px #000;paint-order:stroke fill;text-shadow:0 8px 22px rgba(0,0,0,.55)}
.cap .w.key{color:#7CFFB0}
#prog{left:0;top:0;width:1080px;height:12px;background:rgba(255,255,255,.18)}
#progfill{width:100%;height:100%;background:var(--yellow);transform-origin:0 50%}

.count{font-weight:900;font-size:260px;line-height:1;color:#FFD400;-webkit-text-stroke:18px #000;paint-order:stroke fill;text-shadow:0 14px 40px rgba(0,0,0,.6)}
.count.osom{font-size:230px;color:#fff;-webkit-text-stroke:20px #ff3b30}
.h2b{font-size:128px;color:#FFD400;-webkit-text-stroke:16px #000}
.hook-l1.small{font-size:80px}
.lowcard{padding:30px 54px}
.arrow{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.arrow-t{font-weight:900;font-size:50px;line-height:1.02;color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill}
.end-s{margin-top:34px;font-weight:700;font-size:40px;color:#dbe4f3}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10.0" data-width="1080" data-height="1920">
<div id="stage"><video id="vid" class="clip" data-start="0" data-duration="7.6" muted src="assets/raw.mp4" playsinline></video></div>
<div id="shade" class="clip" data-start="0" data-duration="7.6"></div>
<audio id="music" class="clip" data-start="0" data-duration="10.0" data-volume="0.8" src="assets/music.wav"></audio>
<div id="hook" class="clip center-top" data-start="0.000" data-duration="2.750" style="top:90px"><div class="hook-l1">OSOM! YANG KALAH</div>
  <div class="hook-l2 h2b">BELANJA MAKAN!</div></div>
<div id="cnt0" class="clip center-top" data-start="0.500" data-duration="0.620" style="top:1060px"><div class="count">1</div></div>
<div id="cnt1" class="clip center-top" data-start="1.167" data-duration="0.620" style="top:1060px"><div class="count">2</div></div>
<div id="cnt2" class="clip center-top" data-start="1.833" data-duration="0.620" style="top:1060px"><div class="count">3</div></div>
<div id="osom" class="clip center-top" data-start="2.500" data-duration="0.500" style="top:1030px"><div class="count osom">OSOM!</div></div>
<div id="fl1" class="clip flash" data-start="2.850" data-duration="0.250" style="background:#ffffff"></div>
<div id="bulu" class="clip center-top" data-start="3.000" data-duration="0.950" style="top:170px"><div class="hook-l1 small">TAPI DUIT TINGGAL</div><div class="hook-l2">&lsquo;BULU&rsquo;&hellip;</div></div>
<div id="fl2" class="clip flash" data-start="4.080" data-duration="0.300" style="background:#ffffff"></div>
<div id="risau" class="clip center-top" data-start="4.300" data-duration="1.250" style="top:170px"><div class="banner"><span>JANGAN RISAU!</span></div></div>
<div id="mohon" class="clip center-top" data-start="5.400" data-duration="2.200" style="top:190px"><div class="sticker" style="background:#22c55e;color:#fff;transform:rotate(-3deg)">MOHON ZAKAT UniKL!</div></div>
<div id="arrow" class="clip " data-start="5.000" data-duration="2.600" style="left:640px;top:1020px"><div class="arrow"><svg viewBox="0 0 120 80" width="190" height="126"><path d="M115 40H30M30 40l26-26M30 40l26 26" stroke="#FFD400" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="arrow-t">WEBSITE<br>ZAKAT UniKL</div></div></div>
<div id="lower" class="clip center-top" data-start="5.800" data-duration="1.800" style="top:1540px"><div class="card brand-card lowcard"><div class="wm" style="font-size:84px"><span class="wm-z">zakat</span><span class="wm-u">UniKL</span></div><div class="tagline">Memikul Amanah, Membantu Ummah</div></div></div>
<div id="end" class="clip endcard" data-start="7.600" data-duration="2.400" style=""><div class="end-in"><div class="wm" style="font-size:150px"><span class="wm-z">zakat</span><span class="wm-u">UniKL</span></div>
  <div class="tagline big">Memikul Amanah, Membantu Ummah</div>
  <div class="pill">Dibuka Disember ini &middot; Semua student UniKL</div>
  <div class="end-s">Menang atau kalah osom &mdash; jangan risau!</div></div></div>
<div id="prog" class="clip" data-start="0" data-duration="7.6"><div id="progfill"></div></div>
<audio id="sfx0" class="clip" data-start="0.000" data-duration="1.4" data-volume="0.4" src="assets/sfx/pop.wav"></audio>
<audio id="sfx1" class="clip" data-start="0.200" data-duration="1.4" data-volume="0.35" src="assets/sfx/impact.wav"></audio>
<audio id="sfx2" class="clip" data-start="2.850" data-duration="1.4" data-volume="0.4" src="assets/sfx/impact.wav"></audio>
<audio id="sfx3" class="clip" data-start="3.820" data-duration="1.4" data-volume="0.55" src="assets/sfx/whoosh.wav"></audio>
<audio id="sfx4" class="clip" data-start="4.300" data-duration="1.4" data-volume="0.45" src="assets/sfx/pop.wav"></audio>
<audio id="sfx5" class="clip" data-start="5.450" data-duration="1.4" data-volume="0.4" src="assets/sfx/ding.wav"></audio>
<audio id="sfx6" class="clip" data-start="5.000" data-duration="1.4" data-volume="0.35" src="assets/sfx/pop.wav"></audio>
<audio id="sfx7" class="clip" data-start="5.650" data-duration="1.4" data-volume="0.3" src="assets/sfx/whoosh.wav"></audio>
<audio id="sfx8" class="clip" data-start="7.350" data-duration="1.4" data-volume="0.4" src="assets/sfx/whoosh.wav"></audio>
<audio id="sfx9" class="clip" data-start="7.700" data-duration="1.4" data-volume="0.35" src="assets/sfx/ding.wav"></audio>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.from("#hook .hook-l1",{y:-120,opacity:0,duration:0.22,ease:"back.out(2)"},0.0);
tl.from("#hook .hook-l2",{scale:2.4,opacity:0,rotation:-6,duration:0.25,ease:"power4.out"},0.2);
tl.to("#hook",{y:-420,opacity:0,duration:0.2,ease:"power2.in"},2.55);
tl.fromTo("#cnt0 .count",{scale:2.2,opacity:0},{scale:1,opacity:1,duration:0.16,ease:"power3.out"},0.500);
tl.to("#cnt0 .count",{scale:0.6,opacity:0,duration:0.14},0.960);
tl.fromTo("#cnt1 .count",{scale:2.2,opacity:0},{scale:1,opacity:1,duration:0.16,ease:"power3.out"},1.167);
tl.to("#cnt1 .count",{scale:0.6,opacity:0,duration:0.14},1.627);
tl.fromTo("#cnt2 .count",{scale:2.2,opacity:0},{scale:1,opacity:1,duration:0.16,ease:"power3.out"},1.833);
tl.to("#cnt2 .count",{scale:0.6,opacity:0,duration:0.14},2.293);
tl.fromTo("#osom .count",{scale:3,opacity:0},{scale:1,opacity:1,duration:0.15,ease:"power4.out"},2.5);
tl.to("#osom .count",{scale:1.3,opacity:0,duration:0.15},2.83);
tl.fromTo("#stage",{scale:1},{scale:1.18,duration:0.12,ease:"power3.out"},2.850);
tl.to("#stage",{scale:1,duration:0.35,ease:"power2.inOut"},3.250);
tl.fromTo("#fl1",{opacity:0.7},{opacity:0,duration:0.25,ease:"power2.out"},2.850);
tl.from("#bulu .hook-l1",{y:-80,opacity:0,duration:0.18,ease:"back.out(2)"},3.0);
tl.from("#bulu .hook-l2",{scale:0,rotation:12,duration:0.25,ease:"back.out(2.5)"},3.15);
tl.to("#bulu .hook-l2",{y:30,rotation:-4,duration:0.5,ease:"sine.in"},3.4);
tl.fromTo("#fl2",{opacity:0.8},{opacity:0,duration:0.3,ease:"power2.out"},4.080);
tl.from("#risau .banner",{scale:0,rotation:-10,duration:0.3,ease:"back.out(2.4)"},4.3);
tl.to("#risau .banner",{scale:0,opacity:0,duration:0.18},5.35);
tl.from("#mohon .sticker",{scale:0,duration:0.3,ease:"back.out(2.5)"},5.4);
tl.from("#arrow .arrow",{x:300,opacity:0,duration:0.3,ease:"power3.out"},5.0);
tl.to("#arrow svg",{x:-28,duration:0.3,yoyo:true,repeat:7,ease:"sine.inOut"},5.3);
tl.from("#lower .card",{y:400,duration:0.4,ease:"power3.out"},5.8);
tl.from("#end .wm",{scale:0.4,opacity:0,duration:0.45,ease:"back.out(1.8)"},7.6499999999999995);
tl.from("#end .tagline",{y:40,opacity:0,duration:0.3},7.949999999999999);
tl.from("#end .pill",{scale:0,duration:0.3,ease:"back.out(2)"},8.2);
tl.from("#end .end-s",{opacity:0,y:20,duration:0.3},8.5);
tl.fromTo("#progfill",{scaleX:0},{scaleX:1,duration:7.6,ease:"none"},0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body></html>
